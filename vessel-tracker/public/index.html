<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Vessel Live Position — prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.css" />
<style>
  :root {
    --ink: #10181c; --ink-muted: #566067; --border: #dbe1df; --surface: #ffffff;
    --bg: #f4f6f4; --accent: #0b6e5c; --accent-soft: #e0efe9; --warn: #b9821d; --crit: #b23b30;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; background: var(--bg); color: var(--ink); }
  .bar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .bar h1 { font-size: 14px; margin: 0 12px 0 0; font-weight: 700; }
  .bar input { padding: 7px 10px; border: 1px solid var(--border); border-radius: 7px; font-size: 13px; width: 160px; }
  .bar button { padding: 7px 14px; border: none; border-radius: 7px; background: var(--accent); color: #fff; font-weight: 600; font-size: 13px; cursor: pointer; }
  .bar button.secondary { background: var(--surface); color: var(--ink); border: 1px solid var(--border); }
  .hint { font-size: 11.5px; color: var(--ink-muted); }
  .named-badge { display: flex; align-items: center; gap: 8px; font-size: 13px; flex-wrap: wrap; }
  .named-badge b { font-size: 14px; }
  .bar button.link-btn { background: none; border: none; color: var(--accent); font-size: 12px; font-weight: 600; cursor: pointer; padding: 0; text-decoration: underline; }
  #map { height: calc(100vh - 128px); width: 100%; }
  .status { padding: 8px 16px; font-size: 12.5px; color: var(--ink-muted); background: var(--surface); border-bottom: 1px solid var(--border); }
  .status.error { color: var(--crit); }
  .status.ok { color: var(--accent); }
  .note { padding: 7px 16px; font-size: 11.5px; color: var(--ink-muted); background: var(--accent-soft); border-bottom: 1px solid var(--border); }
</style>
</head>
<body>
  <div class="bar">
    <h1>Vessel Live Position (prototype)</h1>

    <div id="named-controls" class="named-badge" style="display:none">
      <span>클릭한 선박: <b id="named-vessel">—</b></span>
      <button id="stop-named" class="secondary">Stop</button>
      <button id="show-manual" class="link-btn">MMSI로 직접 조회</button>
    </div>

    <div id="manual-controls" style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
      <input id="mmsi" type="text" placeholder="MMSI (e.g. 368207620)" value="368207620" />
      <button id="track">Track (단일 선박)</button>
      <button id="stop" class="secondary">Stop</button>
      <span class="hint">실제 SeaVantage 데이터라 선박이 최근 신호를 보내지 않았으면 조회가 안 될 수 있음</span>
    </div>
  </div>
  <div class="note" id="note" style="display:none"></div>
  <div class="status" id="status">Idle.</div>
  <div id="map"></div>

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.js"></script>
  <script>
    let map = null;
    let marker = null;
    let ws = null;

    // Rough port coordinates [lon, lat] for the routes used in the mockup.
    // Only covers ports that appear on rows with a clickable vessel name —
    // good enough to place a plausible marker when the real AIS API
    // (SeaVantage) isn't reachable, not meant to be survey-grade.
    const PORT_COORDS = {
      "qingdao": [120.33, 36.07],
      "rotterdam": [4.48, 51.92],
      "ningbo": [121.55, 29.87],
      "antwerp": [4.40, 51.22],
      "busan": [129.04, 35.10],
      "long beach": [-118.19, 33.77],
      "shanghai": [121.47, 31.23],
      "hamburg": [9.99, 53.55],
    };

    function findPort(name) {
      return PORT_COORDS[(name || "").trim().toLowerCase()] || null;
    }

    // Great-circle (spherical) interpolation, not flat lon/lat lerp — a real
    // ship on a Busan->Long Beach route bulges north past Hokkaido rather
    // than cutting straight across Japan, because the shortest path on a
    // sphere isn't a straight line on an equirectangular lon/lat grid.
    const toRad = (d) => (d * Math.PI) / 180;
    const toDeg = (r) => (r * 180) / Math.PI;

    function llToVec([lon, lat]) {
      const la = toRad(lat), lo = toRad(lon);
      return [Math.cos(la) * Math.cos(lo), Math.cos(la) * Math.sin(lo), Math.sin(la)];
    }
    function vecToLl([x, y, z]) {
      return [toDeg(Math.atan2(y, x)), toDeg(Math.atan2(z, Math.sqrt(x * x + y * y)))];
    }
    function greatCirclePoint(from, to, t) {
      const v1 = llToVec(from), v2 = llToVec(to);
      let dot = v1[0] * v2[0] + v1[1] * v2[1] + v1[2] * v2[2];
      dot = Math.max(-1, Math.min(1, dot));
      const theta = Math.acos(dot);
      if (theta < 1e-9) return from.slice();
      const sinTheta = Math.sin(theta);
      const a = Math.sin((1 - t) * theta) / sinTheta;
      const b = Math.sin(t * theta) / sinTheta;
      return vecToLl([a * v1[0] + b * v2[0], a * v1[1] + b * v2[1], a * v1[2] + b * v2[2]]);
    }
    function bearingBetween([lon1, lat1], [lon2, lat2]) {
      const phi1 = toRad(lat1), phi2 = toRad(lat2), dLon = toRad(lon2 - lon1);
      const y = Math.sin(dLon) * Math.cos(phi2);
      const x = Math.cos(phi1) * Math.sin(phi2) - Math.sin(phi1) * Math.cos(phi2) * Math.cos(dLon);
      return (toDeg(Math.atan2(y, x)) + 360) % 360;
    }
    function angularDistance(a, b) {
      const v1 = llToVec(a), v2 = llToVec(b);
      const dot = Math.max(-1, Math.min(1, v1[0] * v2[0] + v1[1] * v2[1] + v1[2] * v2[2]));
      return Math.acos(dot);
    }

    // A pure great-circle between two ports is the *shortest spherical path*,
    // not the path a ship actually sails — for Busan->Long Beach that's fine
    // (all open ocean either way), but for Asia<->Europe it would cut straight
    // across Russia/the Middle East, since real ships instead hug the coast via
    // the Suez Canal. These waypoint chains pin the route through the actual
    // chokepoints (Malacca Strait, Bab-el-Mandeb, Suez Canal, Gibraltar) so the
    // multi-segment "great circle" stays over water for the legs we show.
    const SUEZ_WAYPOINTS = [
      [103.8, 1.2],   // Singapore Strait
      [43.3, 12.6],   // Bab-el-Mandeb (Red Sea south entrance)
      [32.55, 29.9],  // Suez Canal, south end
      [32.3, 31.25],  // Suez Canal, north end (Port Said)
      [-5.6, 35.9],   // Strait of Gibraltar
    ];
    const ROUTE_WAYPOINTS = {
      "qingdao|rotterdam": SUEZ_WAYPOINTS,
      "ningbo|antwerp": SUEZ_WAYPOINTS,
      "shanghai|hamburg": SUEZ_WAYPOINTS,
    };

    function buildWaypoints(fromName, toName, from, to) {
      const key = (fromName || "").trim().toLowerCase() + "|" + (toName || "").trim().toLowerCase();
      const mid = ROUTE_WAYPOINTS[key] || [];
      return [from, ...mid, to];
    }

    // Interpolates along a multi-segment waypoint chain (each leg still a
    // proper great-circle arc), splitting t proportionally by each leg's
    // actual angular length so the marker moves at a roughly steady pace
    // along the whole route instead of racing through short legs.
    function pointAlongPath(waypoints, t) {
      const legs = [];
      for (let i = 0; i < waypoints.length - 1; i++) legs.push(angularDistance(waypoints[i], waypoints[i + 1]));
      const total = legs.reduce((a, b) => a + b, 0);
      if (total < 1e-9) return waypoints[0].slice();
      let target = t * total;
      for (let i = 0; i < legs.length; i++) {
        const isLast = i === legs.length - 1;
        if (target <= legs[i] || isLast) {
          const localT = legs[i] < 1e-9 ? 0 : Math.max(0, Math.min(1, target / legs[i]));
          return greatCirclePoint(waypoints[i], waypoints[i + 1], localT);
        }
        target -= legs[i];
      }
      return waypoints[waypoints.length - 1].slice();
    }

    // Deterministic 0..1 pseudo-random from a string, so the same vessel
    // always lands at the same mock spot instead of jumping around on
    // every click/reload.
    function seededFraction(seed) {
      let h = 0;
      for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
      return (h % 1000) / 1000;
    }

    // No real AIS feed is reachable right now (SeaVantage account not wired
    // up), so this places the vessel at a plausible point along its POL->POD
    // route instead of calling the live API. Clearly labeled as an estimate.
    function showMockPosition({ pol, pod, stage, name, mmsi }) {
      const from = findPort(pol);
      const to = findPort(pod);
      if (!from || !to) {
        setStatus(`${pol} → ${pod} 좌표를 몰라 추정 위치를 표시할 수 없습니다.`, "error");
        return;
      }
      const waypoints = buildWaypoints(pol, pod, from, to);

      // Pre-carriage: still near origin port. Main-carriage: mid-ocean,
      // with a bit of per-vessel jitter so it isn't dead-center every time.
      // On-carriage isn't reachable from a vessel-link click today, but
      // handled here for completeness.
      let t;
      if (stage === "loading") t = 0.05 + seededFraction(mmsi) * 0.05;
      else if (stage === "arrived") t = 0.92 + seededFraction(mmsi) * 0.05;
      else t = 0.35 + seededFraction(mmsi) * 0.3;

      const [lon, lat] = pointAlongPath(waypoints, t);
      // Local heading: bearing of a short arc straddling t, not the initial
      // departure bearing — the heading keeps changing along the route (e.g.
      // swinging from NE to E as it arcs over the Pacific, or turning at Suez).
      const delta = 0.01;
      const bearing = bearingBetween(
        pointAlongPath(waypoints, Math.max(0, t - delta)),
        pointAlongPath(waypoints, Math.min(1, t + delta))
      );

      setNote(`⚠️ 추정 위치 — 실제 AIS 신호가 아니라 ${pol} → ${pod} 항로상 진행 단계(${stage})를 바탕으로 대략 배치한 좌표입니다. 지도의 점선은 실제 항적이 아니라 출발항부터 이 추정 위치까지를 이어본 가상의 선입니다(주요 항로는 실제 통항로인 수에즈 운하 등 경유지를 거치도록 보정했습니다 — 대권항로 그대로면 육지를 가로지르는 구간이 있었음).`);
      setStatus(`${name || "MMSI " + mmsi} · 추정 위치 ${lat.toFixed(2)}, ${lon.toFixed(2)}`, "ok");

      clearMarker();
      drawMockRoute(waypoints, t);
      const popupHtml = `<b>${name || "Unknown"}</b><br>MMSI ${mmsi}<br><i>추정 위치 (실시간 AIS 아님)</i>`;
      marker = new mapboxgl.Marker({ element: createVesselEl("#b9821d"), rotationAlignment: "map" })
        .setLngLat([lon, lat])
        .setRotation(bearing)
        .setPopup(new mapboxgl.Popup({ offset: 16 }).setHTML(popupHtml))
        .addTo(map);
      map.flyTo({ center: [lon, lat], zoom: 4 });
    }

    // Draws a dashed line from the origin port to the estimated current
    // position — not a real track, just a visual aid for "how far along"
    // the mock placement implies. Sampled in small steps along the whole
    // waypoint chain (rather than a single straight segment) so it follows
    // the same land-avoiding, antimeridian-aware path as the marker itself.
    function drawMockRoute(waypoints, t) {
      const steps = 60;
      const coords = [];
      let prevLon = null;
      for (let i = 0; i <= steps; i++) {
        const s = (t * i) / steps;
        let [lon, lat] = pointAlongPath(waypoints, s);
        // Keep longitude continuous point-to-point (rather than each one
        // independently wrapped to -180..180) so the line doesn't jump back
        // across the whole map when the route crosses the antimeridian.
        if (prevLon !== null) {
          let diff = lon - prevLon;
          if (diff > 180) lon -= 360;
          else if (diff < -180) lon += 360;
        }
        prevLon = lon;
        coords.push([lon, lat]);
      }
      const geojson = { type: "Feature", geometry: { type: "LineString", coordinates: coords } };

      const addOrUpdate = () => {
        const source = map.getSource("mock-route");
        if (source) {
          source.setData(geojson);
        } else {
          map.addSource("mock-route", { type: "geojson", data: geojson });
          map.addLayer({
            id: "mock-route-line",
            type: "line",
            source: "mock-route",
            layout: { "line-cap": "round", "line-join": "round" },
            paint: { "line-color": "#b9821d", "line-width": 2.5, "line-dasharray": [1.5, 1.5], "line-opacity": 0.85 },
          });
        }
      };
      // The "standard" style loads its layers asynchronously — adding a
      // source/layer before it's ready throws, so defer if needed.
      if (map.isStyleLoaded()) addOrUpdate();
      else map.once("style.load", addOrUpdate);
    }

    const statusEl = document.getElementById("status");
    const noteEl = document.getElementById("note");
    function setStatus(msg, kind) {
      statusEl.textContent = msg;
      statusEl.className = "status" + (kind ? " " + kind : "");
    }
    function setNote(msg) {
      noteEl.textContent = msg;
      noteEl.style.display = msg ? "" : "none";
    }

    function clearMarker() {
      if (marker) { marker.remove(); marker = null; }
      if (map && map.getSource("mock-route")) {
        map.getSource("mock-route").setData({ type: "Feature", geometry: { type: "LineString", coordinates: [] } });
      }
    }

    // Custom hull-shaped icon (bow pointing "up" = 0° COG) so mapboxgl.Marker's
    // built-in setRotation() can turn it to match each vessel's heading —
    // Mapbox's own Maki sprite only has a generic non-directional "ferry" icon.
    function createVesselEl(color) {
      const el = document.createElement("div");
      el.innerHTML = `
        <svg width="26" height="26" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 1 L18.5 19 L12 15.5 L5.5 19 Z" fill="${color}" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
        </svg>`;
      el.style.cursor = "pointer";
      return el;
    }

    async function initMap() {
      const res = await fetch("/config");
      const config = await res.json();
      if (!config.mapboxToken) {
        setStatus("Server has no MAPBOX_TOKEN configured (.env) — map cannot load.", "error");
        return;
      }
      mapboxgl.accessToken = config.mapboxToken;
      map = new mapboxgl.Map({
        container: "map",
        style: "mapbox://styles/mapbox/standard",
        center: [0, 20],
        zoom: 1.5,
      });
      map.addControl(new mapboxgl.NavigationControl(), "top-right");
      startFromQuery();
    }

    function connect(onOpenSend) {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(proto + "//" + location.host + "/ws");

      ws.addEventListener("open", () => onOpenSend());

      ws.addEventListener("message", (evt) => {
        const data = JSON.parse(evt.data);
        if (data.type === "status") setStatus(data.message, "ok");
        if (data.type === "error") setStatus(data.message, "error");
        if (data.type === "position") {
          setStatus(
            `${data.shipName || "MMSI " + data.mmsi} · ${data.lat.toFixed(4)}, ${data.lon.toFixed(4)} · SOG ${data.sog ?? "—"} kn · ${data.timeUtc}`,
            "ok"
          );
          const lngLat = [data.lon, data.lat];
          const popupHtml = `<b>${data.shipName || "Unknown"}</b><br>MMSI ${data.mmsi}<br>SOG ${data.sog ?? "—"} kn · COG ${data.cog ?? "—"}°`;
          if (!marker) {
            marker = new mapboxgl.Marker({ element: createVesselEl("#0b6e5c"), rotationAlignment: "map" })
              .setLngLat(lngLat)
              .setRotation(data.cog ?? 0)
              .setPopup(new mapboxgl.Popup({ offset: 16 }).setHTML(popupHtml))
              .addTo(map);
            map.flyTo({ center: lngLat, zoom: 8 });
          } else {
            marker.setLngLat(lngLat);
            marker.setRotation(data.cog ?? 0);
            marker.getPopup().setHTML(popupHtml);
          }
        }
      });

      ws.addEventListener("close", () => setStatus("Disconnected.", ""));
      ws.addEventListener("error", () => setStatus("WebSocket error.", "error"));
    }

    function trackMmsi(mmsi) {
      if (ws) ws.close();
      clearMarker();
      setNote("");
      setStatus("Connecting...", "");
      connect(() => ws.send(JSON.stringify({ type: "track", mmsi })));
    }

    function trackSingle() {
      const mmsi = document.getElementById("mmsi").value.trim();
      if (!mmsi) { setStatus("Enter an MMSI first.", "error"); return; }
      trackMmsi(mmsi);
    }

    function stopTracking() {
      if (ws) {
        ws.send(JSON.stringify({ type: "stop" }));
        ws.close();
      }
      setStatus("Stopped.", "");
    }

    document.getElementById("track").addEventListener("click", trackSingle);
    document.getElementById("stop").addEventListener("click", stopTracking);
    document.getElementById("stop-named").addEventListener("click", stopTracking);
    document.getElementById("show-manual").addEventListener("click", () => {
      document.getElementById("named-controls").style.display = "none";
      document.getElementById("manual-controls").style.display = "flex";
      setNote("");
    });

    // Arrived from the cargo screen with a vessel name/MMSI (+ optionally
    // pol/pod/stage for the route the mockup row was showing).
    function startFromQuery() {
      const params = new URLSearchParams(location.search);
      const qName = params.get("name");
      const qMmsi = params.get("mmsi");
      const qPol = params.get("pol");
      const qPod = params.get("pod");
      const qStage = params.get("stage");
      if (qMmsi || qName) {
        document.getElementById("mmsi").value = qMmsi || "";
        document.getElementById("named-vessel").textContent = qName || ("MMSI " + qMmsi);
        document.getElementById("manual-controls").style.display = "none";
        document.getElementById("named-controls").style.display = "flex";

        if (qPol && qPod) {
          showMockPosition({ pol: qPol, pod: qPod, stage: qStage, name: qName, mmsi: qMmsi });
        } else if (qMmsi) {
          trackMmsi(qMmsi);
        } else {
          setStatus(`${qName}의 MMSI를 알 수 없어 조회할 수 없습니다.`, "error");
        }
      }
    }

    initMap();
  </script>
</body>
</html>
